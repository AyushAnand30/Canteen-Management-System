<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTP Verification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: transparent;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .otp-container {
      background-color: rgba(255, 250, 234, 0.85);
      text-align: center;
      padding: 25px;
      max-width: 320px;
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(5px);
    }

    .logo img {
      width: 60px;
      margin-bottom: 10px;
      border-radius: 60px;
    }

    h2 {
      font-size: 22px;
      font-family: "Comic Relief", system-ui;
      font-weight: 400;
      font-style: normal;
      color: #000;
      margin-bottom: 5px;
    }

    p {
      color: #000;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .otp-inputs {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .otp-inputs input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    .submit-link {
      display: block;
      background-color: #000;
      color: #f7f5f2;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .resend {
      font-size: 12px;
      color: #4d2600;
      margin-top: 20px;
    }

    .resend a {
      color: #4d2600;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="otp-container">
  <div class="logo">
    <img src="/Asset/Logo.jpg" alt="College Logo">
  </div>
  <h2>OTP Verification</h2>
  <p>Enter the 4-digit OTP sent to your mobile number</p>

  <div class="otp-inputs">
    <input type="text" maxlength="1" pattern="\d*" required>
    <input type="text" maxlength="1" pattern="\d*" required>
    <input type="text" maxlength="1" pattern="\d*" required>
    <input type="text" maxlength="1" pattern="\d*" required>
  </div>

  <!-- Link styled as a button -->
  <a href="Home.html" class="submit-link">Verify OTP</a>

  <p class="resend">Didn't receive the code? <a href="#">Resend OTP</a></p>
</div>

</body>
</html>
