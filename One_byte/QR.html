<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment QR Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f7f7f7;
      padding: 50px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: auto;
    }
    img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin: 20px 0;
    }
    .note {
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Scan to Pay</h2>
    <img src="/Asset/QR.jpg" alt="QR Code for Payment" />
    <p class="note">Use any UPI or QR-compatible app to scan and pay</p>
  </div>
</body>
</html>
